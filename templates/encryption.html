{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Encryption - Image Steganography Project</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #2f2b2b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            animation: fadeIn 1s ease-in-out;
        }

        /* Container styling */
        .container {
            max-width: 600px;
            background: #e8a343;
            padding: 20px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            animation: slideUp 1s ease-out;
        }

        /* Heading styling */
        h1 {
            text-align: center;
            color: #333;
            animation: fadeInUp 1s ease-in-out;
        }

        /* Form group styling */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Input styling */
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgb(235, 226, 92);
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        /* Button styling */
        button {
            width: 100%;
            padding: 10px;
            background: #fffdfd;
            border: none;
            color: #844c01;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Button hover effect */
        button:hover {
            background: #343138;
            transform: scale(1.05);
        }

        /* Message box */
        p {
            font-size: 18px;
            text-align: center;
            color: green;
            font-weight: bold;
            animation: fadeInUp 1.5s ease-in-out;
        }

        /* Keyframe animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center">Hide Your Text In Image</h1>
        <form action="{% url 'encryption' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="image">Select an Image:</label>
                <input type="file" class="form-control-file" id="image" name="image" required>
            </div>
            <div class="form-group">
                <label for="text">Enter the Text:</label>
                <textarea class="form-control" id="text" name="text" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

   {% if message %}
        <p>{{ message }}</p>
   {% endif %}

</body>
</html>

   <p><a href="{% url 'index' %}" class="home-button">Home </a></p>


<style>
    .home-button {
        display: inline-block;
        width: 150px;
        padding: 12px;
        background: linear-gradient(45deg, #030808, #060e0a);
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        border-radius: 50px;
        transition: 0.3s ease-in-out;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
    }

    .home-button::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300%;
        height: 300%;
        background: rgba(255, 255, 255, 0.2);
        transition: 0.4s ease-in-out;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
    }

    .home-button:hover::before {
        transform: translate(-50%, -50%) scale(1);
    }

    .home-button:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgb(219, 214, 214);
    }
</style>

</body>
</html>
